services:
  - type: web
    name: starfall
    runtime: node
    plan: free
    # Nothing to install: three.js is vendored in vendor/ and serve.js has no
    # runtime dependencies. The only dep in package.json is for the test probe.
    buildCommand: echo "no build step"
    startCommand: node serve.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
